name: AE Studio macOS verification
on:
  push:
    branches: [mac-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ae-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage native editors
        run: python3 macos/stage_native.py
      - name: Test original native import and export
        run: python3 macos/test_native_exports.py
      - name: Test all original editor windows
        run: python3 macos/test_native_gui.py
      - name: Build Mac companion and offline document runtimes
        id: bundle
        run: python3 macos/build_companion.py
      - name: Write the format guide
        run: node macos/format_guide.cjs
      - name: Embed approved Google desktop registration
        env:
          AE_GOOGLE_DESKTOP_JSON: ${{ secrets.AE_GOOGLE_DESKTOP_JSON }}
          AE_REQUIRE_GOOGLE_REGISTRATION: ${{ github.repository == 'ggamdang/ae-studio' && '1' || '0' }}
        run: python3 macos/bundle_registration.py
      - name: Bundle optional Mac local AI setup
        run: python3 macos/build_local_ai.py
      - name: Test Mac companion
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 macos/test_companion.py
      - name: Package and verify installation
        run: python3 macos/package.py
      - name: Save shareable installer
        uses: actions/upload-artifact@v4
        with:
          name: AE-Studio-Mac-Apple-Silicon-Preview
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Collect shareable diagnostics
        if: always()
        run: python3 macos/diagnostics.py
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-companion-verification
          path: macos/diagnostics/
          retention-days: 3
          if-no-files-found: warn
