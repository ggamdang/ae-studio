name: Film export decoder check
on:
  push:
    branches: [mac-film-probe]
permissions:
  contents: read
jobs:
  decode:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0 numpy==2.4.6 opencv-python-headless==4.13.0.92
      - run: python macos/film_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-decoder-evidence
          path: film-probe/
          retention-days: 3
